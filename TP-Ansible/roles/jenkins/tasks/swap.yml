---
- name: Vérifier les swaps actifs
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: jenkins_swap_status
  changed_when: false

- name: Créer et activer le swap
  when: jenkins_swap_file not in jenkins_swap_status.stdout
  block:
    - name: Allouer le fichier de swap
      ansible.builtin.command: "fallocate -l {{ jenkins_swap_size_mb }}M {{ jenkins_swap_file }}"
      args:
        creates: "{{ jenkins_swap_file }}"

    - name: Restreindre les droits du fichier de swap
      ansible.builtin.file:
        path: "{{ jenkins_swap_file }}"
        mode: "0600"

    - name: Formater le swap
      ansible.builtin.command: "mkswap {{ jenkins_swap_file }}"
      changed_when: true

    - name: Activer le swap
      ansible.builtin.command: "swapon {{ jenkins_swap_file }}"
      changed_when: true

- name: Rendre le swap persistant
  ansible.posix.mount:
    path: none
    src: "{{ jenkins_swap_file }}"
    fstype: swap
    opts: sw
    state: present
